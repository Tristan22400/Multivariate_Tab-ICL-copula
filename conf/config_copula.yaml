defaults:
  - _self_
  - model: copula
  - data: multivariate
  - experiment: default

seed: 42

training:
  device: auto
  batch_size: 8
  steps: 30000
  lr: 3.0e-4
  lr_min: 1.0e-6
  clip_grad_norm: 1.0
  log_every: 100
  val_every: 500
  save_every: 5000
  ckpt_dir: ./checkpoints/copula
  es_samples: 50        # MC samples per test instance for energy score at validation
