defaults:
  - model: copula_tabicl_v2
  - data: multivariate
  - _self_

seed: 42


training:
  device: auto
  batch_size: 8          # B datasets per step (unused if dataset_dir is set; stored in episode)
  steps: 100000
  lr: 1.0e-4
  lr_min: 1.0e-8
  warmup_steps: 1000        # linear LR warmup before cosine decay
  weight_decay: 0.0
  clip_grad_norm: 0.1
  gradient_accumulation_steps: 16  # accumulate gradients over N steps before optimizer update
  nll_weight: 1.0            # weight on the Woodbury NLL term; set 0.0 to train with auxiliary loss only
  aux_mse_weight: 1.0        # peak weight for off-diagonal MSE auxiliary loss; set 0 to disable
  aux_mse_anneal_frac: 0.7   # anneal weight from aux_mse_weight to 0 over this fraction of steps
  log_every: 100
  val_every: 500
  plot_every: 500
  save_every: 5000
  ckpt_dir: ./checkpoints/copula-tabicl/mse
  resume_from: null  # direct checkpoint path; takes priority over ckpt_dir auto-detection
  dataset_dir: ./data/pit_hyperplane_debug  # path to pre-computed PIT episodes; required for training
  val_n_episodes: 50       # number of held-out episodes reserved for validation (never used in training)
  compile: true          # set true to enable torch.compile (~60 s one-time JIT cost, then 20-40% faster)

dataset:
  n_episodes: 100000
  output_dir: ./data/pit_episodes_kernel_d4_n_train_256
  resume: true
  batch_size: 16         # B datasets per episode saved to disk
  episodes_per_step: 32   # K episodes produced per GPU step (effective batch = B*K); reduce if OOM
  num_workers: 2
  k_folds: 3           # K-fold for training PIT (0 or null for LOO)

tabicl:
  ckpt: tabicl-regressor-v2-20260212.ckpt
  pit_batch_size: 256     # LOO chunk size (reduce if OOM during Phase 1)
  pit_eps: 1.0e-6        # fixed probit clamping epsilon

attn_copula:
  m: 64                  # hidden dim for feature/row encoders and attention
  n_heads: 4
  n_layers: 2            # self-attention depth
  dropout: 0.15
  weight_decay: 5.0e-3
  alpha: 3.0             # tanh scale for Cholesky off-diag entries
  lambda_min: 1.0e-4
  lambda_max: 0.9
  include_outer: true    # include vech(z z^T) in row encoder input
  steps: 5000
  lr: 1.0e-3
  lr_min: 1.0e-6
  warmup_steps: 200         # linear LR warmup before cosine decay
  clip_grad: 1.0
  val_every: 100         # evaluate on held-out val set every N steps
  patience: 500          # early stopping: stop if no improvement for N steps




