defaults:
  - model: tabicl-archi
  - data: multivariate
  - _self_

seed: 42  # test edit


training:
  device: auto
  batch_size: 16          # B datasets per step (unused if dataset_dir is set; stored in episode)
  steps: 100000
  lr: 3.0e-4              # 3e-4 matches the working debug scripts (icl_corr_net3_pit / icl_corr_net_z)
  lr_min: 1.0e-6
  warmup_steps: 200         # linear LR warmup before cosine decay (reduced proportionally from 1000)
  weight_decay: 1.0e-4    # 1e-4 matches debug (was 0.0)
  clip_grad_norm: 1.0     # 1.0 matches debug (was 0.1 — too restrictive)
  gradient_accumulation_steps: 1   # 1 matches debug — more frequent optimizer updates (was 16)
  nll_weight: 0.0            # 0.0: use MSE-only like the working debug scripts (was 1.0 NLL-dominated)
  aux_mse_weight: 1.0        # peak weight for off-diagonal MSE auxiliary loss; set 0 to disable
  aux_mse_anneal_frac: 10.0  # prevent MSE from being annealed to 0 (was 0.7 which killed the loss at 70% of training)
  log_every: 100
  val_every: 500
  plot_every: 500
  save_every: 5000
  ckpt_dir: ./checkpoints/pit_hyperplane_multimodal-tabicl-nll # directory for saving checkpoints; auto-detected if resuming from ckpt_dir
  resume_from: null  # direct checkpoint path; takes priority over ckpt_dir auto-detection
  reset_icl_gate: false  # set true when resuming from a checkpoint where icl_gate is stuck near -3.0
  dataset_dir: ./data/pit_hyperplane_multimodal # path to pre-computed PIT episodes; required for training
  val_n_episodes: 50       # number of held-out episodes reserved for validation (never used in training)
  compile: false         # disabled: torch.compile can cause issues with bfloat16 Woodbury NLL
  n_think: 8             # thinking rows prepended to support set (attention sinks / extra compute)
  use_oracle_z: true    # replace Z_test with oracle PIT z*=(y-mu*)/sigma* during training; Z_train stays as TabICL z


dataset:
  n_episodes: 100000
  output_dir: null  # auto-generated from data config parameters; override to force a specific path
  resume: true
  batch_size: 16        # B datasets per episode saved to disk
  episodes_per_step: 4    # K episodes produced per GPU step (effective batch = B*K); reduce if OOM
  num_workers: 2
  k_folds: 3           # K-fold for training PIT (0 or null for LOO)

tabicl:
  ckpt: tabicl-regressor-v2-20260212.ckpt
  pit_batch_size: 256     # LOO chunk size (reduce if OOM during Phase 1)
  pit_eps: 1.0e-6        # fixed probit clamping epsilon

comparison:
  n_datasets: 50         # number of episodes used for ICL vs per-dataset model comparison

attn_copula:
  m: 64                  # hidden dim for feature/row encoders and attention
  n_heads: 4
  n_layers: 2            # self-attention depth
  dropout: 0.15
  weight_decay: 5.0e-3
  alpha: 3.0             # tanh scale for Cholesky off-diag entries
  lambda_min: 1.0e-4
  lambda_max: 0.9
  include_outer: true    # include vech(z z^T) in row encoder input
  steps: 5000
  lr: 1.0e-3
  lr_min: 1.0e-6
  warmup_steps: 200         # linear LR warmup before cosine decay
  clip_grad: 1.0
  val_every: 100         # evaluate on held-out val set every N steps
  patience: 1000          # early stopping: stop if no improvement for N steps




